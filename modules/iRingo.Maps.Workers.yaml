name: ' iRingo: 🗺️ Maps (Rewrite)'
description: 自定义 Maps app\n添加国际版功能\n自定义服务版本
author: VirgilClyne[https://github.com/VirgilClyne]
homepage: https://NSRingo.github.io/guide/GeoServices/maps
icon: https://developer.apple.com/assets/elements/icons/maps/maps-128x128.png
compat_arguments:
  endpoint: mapkit.pages.dev
compat_arguments_desc: |-
  endpoint: [重写] 服务端点
      ├ mapkit.pages.dev: 首选；直连；无需代理
      ├ dev.mapkit.pages.dev: 开发版
      └ mapkit.nanocat.cloud: Worker 版；需要代理
rules:
- domain_suffix:
    match: is.autonavi.com
    policy: DIRECT
- domain:
    match: gspe11-2-cn-ssl.ls.apple.com
    policy: DIRECT
- domain:
    match: gspe12-cn-ssl.ls.apple.com
    policy: DIRECT
- domain:
    match: gspe19-cn-ssl.ls.apple.com
    policy: DIRECT
- domain:
    match: gspe19-2-cn-ssl.ls.apple.com
    policy: DIRECT
- domain:
    match: gspe79-cn-ssl.ls.apple.com
    policy: DIRECT
url_rewrites:
- match: ^https?:\/\/configuration\.ls\.apple\.com\/config\/defaults
  location: https://{{{endpoint}}}/config/defaults
  status_code: 307
- match: ^https?:\/\/gspe35-ssl\.ls\.apple\.com\/config\/announcements
  location: https://{{{endpoint}}}/config/announcements
  status_code: 307
- match: ^https?:\/\/gspe35-ssl\.ls\.apple\.com\/geo_manifest\/dynamic\/config
  location: https://{{{endpoint}}}/geo_manifest/dynamic/config
  status_code: 307
mitm:
  hostnames:
    includes:
    - configuration.ls.apple.com
    - gspe35-ssl.ls.apple.com
